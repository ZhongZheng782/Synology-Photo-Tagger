name: Diagnose Photo Tagger to MLX connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-mlx:
    # The NAS-hosted runner can reach DSM over the LAN.
    runs-on: [self-hosted, linux, x64, ubuntu-latest]
    timeout-minutes: 2
    steps:
      - name: Check MLX connectivity from the Photo Tagger container
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i SYNOLOGY-PHOTO-TAGGER python3 - <<'PY'
          import os
          import socket
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import urlopen

          base_url = os.environ.get("MLX_SERVER_URL", "")
          parsed = urlsplit(base_url)
          host = parsed.hostname
          port = parsed.port or (443 if parsed.scheme == "https" else 80)
          print(f"MLX endpoint host={host} port={port}")
          print(f"MLX API key configured={bool(os.environ.get('MLX_SERVER_API_KEY'))}")
          if not host:
              raise SystemExit("MLX_SERVER_URL is empty or invalid")

          try:
              addresses = sorted({entry[4][0] for entry in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)})
              print(f"DNS resolved={addresses}")
          except OSError as error:
              print(f"DNS lookup failed: {type(error).__name__}: {error}")
              addresses = []

          # Current interface addresses distinguish Docker DNS/Tailscale routing from LAN reachability.
          candidates = addresses or ["100.99.115.6", "192.168.31.133", "192.168.31.82"]
          for address in candidates:
              try:
                  with socket.create_connection((address, port), timeout=8):
                      print(f"TCP connection to {address}=ok")
              except OSError as error:
                  print(f"TCP connection to {address} failed: {type(error).__name__}: {error}")
                  continue

              try:
                  health_url = f"{parsed.scheme}://{address}:{port}/health"
                  with urlopen(health_url, timeout=8) as response:
                      print(f"MLX health HTTP={response.status}")
                      print(f"MLX health body={response.read(500).decode('utf-8', 'replace')}")
              except HTTPError as error:
                  print(f"MLX health HTTP={error.code}")
                  print(f"MLX health body={error.read(500).decode('utf-8', 'replace')}")
              except (OSError, URLError) as error:
                  print(f"MLX health request to {address} failed: {type(error).__name__}: {error}")

      - name: Test MLX reachability with NAS host networking
        shell: bash
        run: |
          set -euo pipefail
          docker run -i --rm --network host --entrypoint python3 \
            wenchiehlee1020/synology-photo-tagger:v0.2 - <<'PY'
          import socket
          from urllib.request import urlopen

          host = "mac-mini.tail28f10.ts.net"
          addresses = ["100.99.115.6", "192.168.31.133", "192.168.31.82"]
          try:
              print("host DNS:", sorted({item[4][0] for item in socket.getaddrinfo(host, 5001, type=socket.SOCK_STREAM)}))
          except OSError as error:
              print(f"host DNS failed: {type(error).__name__}: {error}")
          for address in addresses:
              try:
                  with socket.create_connection((address, 5001), timeout=3):
                      print(f"host-network TCP to {address}: ok")
                  with urlopen(f"http://{address}:5001/health", timeout=3) as response:
                      print(f"host-network MLX health at {address} HTTP={response.status}")
              except OSError as error:
                  print(f"host-network request to {address} failed: {type(error).__name__}: {error}")
          PY
          PY
