name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            wenchiehlee1020/synology-photo-tagger:latest
            wenchiehlee1020/synology-photo-tagger:v0.3.9
            wenchiehlee1020/synology-photo-tagger:sha-${{ github.sha }}

      - name: Update Docker Hub repository overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: wenchiehlee1020/synology-photo-tagger
          short-description: Synology Photos browser with private MLX photo analysis, document OCR, and confirmed person metadata context (v0.3.9).
          readme-filepath: ./DOCKERHUB.md
