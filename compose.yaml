services:
  synology-photo-tagger:
    image: wenchiehlee1020/synology-photo-tagger:latest
    build: .
    container_name: SYNOLOGY-PHOTO-TAGGER
    restart: unless-stopped
    environment:
      PORT: 5000
      SYNOLOGY_URL: ${SYNOLOGY_URL:-}
      PHOTO_LIBRARY_PATH: /Photos
      DEBUG_SHELL: ${DEBUG_SHELL:-false}
    extra_hosts:
      - "wenchiehlee.synology.me:192.168.31.101"
    ports:
      - "${WEB_PORT:-5056}:5000"
      - "127.0.0.1:${DEBUG_SSH_PORT:-2223}:22"
    volumes:
      - ${PHOTO_LIBRARY_PATH:-/volume1/homes/wjlee/Photos}:/Photos:ro
      - ${DEBUG_SSH_DIR:-/volume1/docker/synology-photo-tagger/ssh}:/run/ssh:ro
